// ---------- helpers ----------
function loyaltySchedule(start, floor, step, months) {
  const out = [];
  let price = start;
  for (let i = 0; i <= months; i++) {
    out.push(Math.max(floor, +price.toFixed(0)));
    price = Math.max(floor, price - step);
  }
  return out;
}

function StaircaseChart({ start, floor, step, months, accent }) {
  const values = loyaltySchedule(start, floor, step, months);
  const max = start;
  const min = floor;
  const w = 260;
  const h = 66;
  const padX = 4;
  const barW = (w - padX * 2) / values.length - 6;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {values.map((v, i) => {
        const norm = (v - min) / Math.max(1, max - min);
        const barH = 14 + norm * (h - 24);
        const x = padX + i * (barW + 6);
        const y = h - barH - 12;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} rx={4} fill={i === values.length - 1 ? accent : `${accent}55`} />
            <text x={x + barW / 2} y={h - 1} textAnchor="middle" fontSize="7.5" fill={C.inkFaint} fontFamily={FONT_BODY}>
              {i === 0 ? "štart" : `M${i}`}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

              <ChevronDown size={15} color="rgba(255,255,255,0.7)" style={{ transform: tariffExpanded ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
            </div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginTop: 8 }}>
              <span style={{ color: "#fff", fontFamily: FONT_HEAD, fontSize: 30, fontWeight: 700, lineHeight: 1 }}>{tariff.price}</span>
              <span style={{ color: "rgba(255,255,255,0.75)", fontFamily: FONT_BODY, fontSize: 13 }}>€ / mesiac</span>
            </div>
          </div>
          <div
            onClick={() => setPicker(picker === "addon" ? null : "addon")}
            style={{ width: 34, height: 34, borderRadius: 999, background: "rgba(255,255,255,0.18)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}
          >
            <Plus size={17} color="#fff" />
          </div>
        </div>

        {tariff.digitalOnly && (
          <div style={{ marginTop: 10 }}>
            <Pill tone="coral"><CreditCard size={11} /> Iba digitálne, cez kartu</Pill>
          </div>
        )}

        {tariffExpanded && (
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid rgba(255,255,255,0.2)" }}>
            <ProgressBar pct={tariff.dataPct} color="#fff" label="Mobilné dáta" value={tariff.dataLabel} />
            <ProgressBar pct={tariff.minPct} color="#fff" label="Volania / SMS" value={tariff.minLabel} />
            {tariff.loyalty && (
              <div style={{ marginTop: 6 }}>
                <div style={{ color: "#fff", fontFamily: FONT_BODY, fontSize: 11, fontWeight: 600, marginBottom: 6 }}>
                  Vernostná zľava klesá k {tariff.loyalty.floor} €
                </div>
                <StaircaseChart start={tariff.price} floor={tariff.loyalty.floor} step={tariff.loyalty.step} months={tariff.loyalty.months} accent="#fff" />
              </div>
            )}
            <div
              onClick={() => setPicker(picker === "tariff" ? null : "tariff")}
              style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 5, marginTop: 10, padding: "9px 0", borderRadius: 10, background: "rgba(255,255,255,0.15)", cursor: "pointer" }}
            >
              <span style={{ color: "#fff", fontFamily: FONT_BODY, fontSize: 12, fontWeight: 600 }}>Zmeniť program</span>
              <ChevronRight size={13} color="#fff" />
            </div>
          </div>
        )}
      </div>

      {picker === "tariff" && (
        <Picker
          items={tariffCatalog}
          onClose={() => setPicker(null)}
          onPick={(id) => { onChangeTariff(activeNumberId, id); setPicker(null); }}
          renderRight={(it) => (
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12 }}>{it.price} €</span>
              {it.id === assignment.tariffId && <Check size={13} color={C.violet} />}
            </span>
          )}
        />
      )}

      {activeAddOns.map((a) => (
        <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 13px", marginBottom: 8 }}>
          <span style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13 }}>{a.name}</span>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12 }}>+{a.price} €</span>
            <Trash2 size={13} color={C.inkFaint} onClick={() => onRemoveAddOn(activeNumberId, a.id)} style={{ cursor: "pointer" }} />
          </div>
        </div>
      ))}

      {picker === "addon" && (
        <Picker
          items={availableAddOns.length ? availableAddOns : [{ id: "none", name: "Všetky balíčky sú už aktívne", price: null }]}
          onClose={() => setPicker(null)}
          onPick={(id) => { if (id !== "none") onAddAddOn(activeNumberId, id); setPicker(null); }}
        />
      )}

      {/* fixné služby */}
      <div style={{ marginTop: 22 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <SectionHeader title="Fixné služby" />
          <div onClick={() => setPicker(picker === "fixed" ? null : "fixed")} style={{ display: "flex", alignItems: "center", gap: 4, cursor: "pointer", color: C.violet, fontFamily: FONT_BODY, fontSize: 12, fontWeight: 600, marginTop: -10 }}>
            <Plus size={13} /> Pridať
          </div>
        </div>

        {activeFixed.length === 0 && picker !== "fixed" && (
          <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 12, marginBottom: 8 }}>Zatiaľ žiadny internet ani TV k tomuto účtu.</div>
        )}

        {activeFixed.map((f) => {
          const isOpen = expandedFixed === f.id;
          return (
            <div key={f.id} style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 13, marginBottom: 8 }}>
              <div onClick={() => setExpandedFixed(isOpen ? null : f.id)} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
                <div style={{ width: 32, height: 32, borderRadius: 9, background: C.violetSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <f.icon size={15} color={C.violet} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13, fontWeight: 600 }}>{f.name}</div>
                  <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11 }}>{f.desc}</div>
                </div>
                <span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12 }}>{f.price} €</span>
                <ChevronDown size={14} color={C.inkFaint} style={{ transform: isOpen ? "rotate(180deg)" : "none" }} />
              </div>
              {isOpen && (
                <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.line}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <Pill tone="green"><Check size={11} /> Aktívne, funguje bez výpadku</Pill>
                  <Trash2 size={13} color={C.inkFaint} onClick={() => onRemoveFixed(f.id)} style={{ cursor: "pointer" }} />
                </div>
              )}
            </div>
          );
        })}

        {picker === "fixed" && (
          <Picker
            items={availableFixed.length ? availableFixed : [{ id: "none", name: "Všetky fixné služby sú už aktívne", price: null }]}
            onClose={() => setPicker(null)}
            onPick={(id) => { if (id !== "none") onAddFixed(id); setPicker(null); }}
          />
        )}
      </div>

      {/* promo — visually secondary */}
      <div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 8 }}>
        <div style={{ background: C.surfaceSoft, borderRadius: 14, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 12.5, fontWeight: 600 }}>Odporuč 4ku priateľom</div>
            <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11 }}>Získaj kredit 5 € za každé odporúčanie</div>
          </div>
          <ChevronRight size={14} color={C.inkFaint} />
        </div>
        <div style={{ background: C.surfaceSoft, borderRadius: 14, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 12.5, fontWeight: 600 }}>Nový telefón na splátky</div>
            <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11 }}>Pozri si aktuálnu ponuku telefónov</div>
          </div>
          <ChevronRight size={14} color={C.inkFaint} />
        </div>
      </div>
    </div>
  );
}

// ---------- one independent phone instance ----------
function PhoneApp({ label }) {
  const [tab, setTab] = useState("home");
  const [activeNumberId, setActiveNumberId] = useState("n1");
  const [assignments, setAssignments] = useState({
    n1: { tariffId: "t3", addOns: ["a1"] },
    n2: { tariffId: "t1", addOns: [] },
  });
  const [fixedActive, setFixedActive] = useState(["f1"]);
  const [overlay, setOverlay] = useState(null); // 'hugo' | 'notif' | null

  const onChangeTariff = (numberId, tariffId) => setAssignments((prev) => ({ ...prev, [numberId]: { ...prev[numberId], tariffId } }));
  const onAddAddOn = (numberId, addOnId) => setAssignments((prev) => ({ ...prev, [numberId]: { ...prev[numberId], addOns: [...prev[numberId].addOns, addOnId] } }));
  const onRemoveAddOn = (numberId, addOnId) => setAssignments((prev) => ({ ...prev, [numberId]: { ...prev[numberId], addOns: prev[numberId].addOns.filter((a) => a !== addOnId) } }));
  const onAddFixed = (fixedId) => setFixedActive((prev) => [...prev, fixedId]);
  const onRemoveFixed = (fixedId) => setFixedActive((prev) => prev.filter((f) => f !== fixedId));

  const tabs = useMemo(() => ([
    { id: "home", label: "Domov", icon: Home },
    { id: "wallet", label: "Peňaženka", icon: WalletIcon },
  ]), []);

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 14 }}>
      {label && <div className="phone-label"><i></i>{label}</div>}
      <div style={{ width: 375, height: 780, borderRadius: 44, background: "#000", padding: 10, boxShadow: "0 30px 60px rgba(30,21,48,0.35)" }}>
        <div style={{ width: "100%", height: "100%", borderRadius: 34, background: C.bg, overflow: "hidden", display: "flex", flexDirection: "column", position: "relative" }}>
          <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 120, height: 22, background: "#000", borderBottomLeftRadius: 14, borderBottomRightRadius: 14, zIndex: 30 }} />
          <StatusBar />

          {overlay === "hugo" && <HugoChat onClose={() => setOverlay(null)} />}
          {overlay === "notif" && <NotificationsPanel onClose={() => setOverlay(null)} />}

          <div style={{ flex: 1, overflowY: "auto" }}>
            {tab === "home" && (
              <HomeScreen
                numbers={seedNumbers}
                activeNumberId={activeNumberId}
                onSelectNumber={setActiveNumberId}
                assignments={assignments}
                onChangeTariff={onChangeTariff}
                onAddAddOn={onAddAddOn}
                onRemoveAddOn={onRemoveAddOn}
                fixedActive={fixedActive}
                onAddFixed={onAddFixed}
                onRemoveFixed={onRemoveFixed}
                onOpenHugo={() => setOverlay("hugo")}
                onOpenNotifications={() => setOverlay("notif")}
              />
            )}
            {tab === "wallet" && <WalletScreen />}
          </div>

          <div style={{ display: "flex", justifyContent: "space-around", padding: "10px 10px 22px", background: C.surface, borderTop: `1px solid ${C.line}` }}>
            {tabs.map(({ id, label: tlabel, icon: Icon }) => {
              const isActive = tab === id;
              return (
                <div key={id} onClick={() => { setTab(id); setOverlay(null); }} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", color: isActive ? C.violet : C.inkFaint }}>
                  <Icon size={20} strokeWidth={isActive ? 2.4 : 1.8} />
                  <span style={{ fontSize: 10, fontFamily: FONT_BODY, fontWeight: 600 }}>{tlabel}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- root: two independent screens side by side ----------
function Moja4kaPrototype() {
  return (
    <div className="deck">
      <PhoneApp label="Variant A" />
      <PhoneApp label="Variant B" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Moja4kaPrototype />);
</script>
