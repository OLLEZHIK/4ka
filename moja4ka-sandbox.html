  .meta {

    padding: 4px 10px; color: var(--ink-dim); background: var(--panel);
    letter-spacing: .04em;
  }

  /* ---------- deck of phones ---------- */
  .deck {
    display: flex; align-items: flex-start;
    gap: 40px;
    flex-wrap: nowrap;              /* the two screens stay side by side, always */
    justify-content: safe center;
    overflow-x: auto;               /* narrow viewport scrolls the deck, never the page */
    overscroll-behavior-x: contain;
    padding: 28px 22px 56px;
    scrollbar-width: thin;
  }
  .deck > * { flex: 0 0 auto; }
  @media (max-width: 900px) { .deck { gap: 24px; } }

  .phone-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .phone-label i { width: 5px; height: 5px; border-radius: 999px; background: var(--accent); display: block; }

  /* sandbox-only controls: they sit outside the device frame, not in the product UI */
  .chip {
    font: inherit; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-dim); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 4px 9px; cursor: pointer;
  }

const dataToGb = (label) => {
  if (!label) return -1;
  if (/neobmedz/i.test(label)) return 9999;
  const m = String(label).match(/([\d.,]+)\s*GB/i);
  return m ? parseFloat(m[1].replace(",", ".")) : 0;
};

const inPriceBand = (price, band) =>
  band === "lt5" ? price < 5 : band === "5-15" ? price >= 5 && price <= 15 : band === "gt15" ? price > 15 : true;

const inDurationBand = (validity, band) =>
  band === "month" ? validity === "Mesačne" : band === "30" ? validity === "30 dní" : band === "15" ? validity === "15 dní" : true;

const sortServices = (items, sort) => {
  const out = [...items];
  if (sort === "price-asc") out.sort((a, b) => a.price - b.price);
  else if (sort === "price-desc") out.sort((a, b) => b.price - a.price);
  else if (sort === "data-asc") out.sort((a, b) => dataToGb(a.data) - dataToGb(b.data));
  else if (sort === "data-desc") out.sort((a, b) => dataToGb(b.data) - dataToGb(a.data));
  else out.sort((a, b) => (b.recommended ? 1 : 0) - (a.recommended ? 1 : 0) || a.price - b.price);
  return out;
};

// ---------- helpers ----------
function loyaltySchedule(start, floor, step, months) {
  const out = [];
  let price = start;
  for (let i = 0; i <= months; i++) {
    out.push(Math.max(floor, +price.toFixed(0)));
    price = Math.max(floor, price - step);
  }
  return out;
}

function StaircaseChart({ start, floor, step, months, accent, labelColor }) {
  const values = loyaltySchedule(start, floor, step, months);
  const max = start;
  const min = floor;
  const w = 260;
  const h = 66;
  const padX = 4;
  const barW = (w - padX * 2) / values.length - 6;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {values.map((v, i) => {
        const norm = (v - min) / Math.max(1, max - min);
        const barH = 14 + norm * (h - 24);
        const x = padX + i * (barW + 6);
        const y = h - barH - 12;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} rx={4} fill={i === values.length - 1 ? accent : `${accent}55`} />
            <text x={x + barW / 2} y={h - 1} textAnchor="middle" fontSize="7.5" fill={labelColor || C.inkFaint} fontFamily={FONT_BODY}>
              {i === 0 ? "štart" : `M${i}`}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ---------- promo rail: two banners per screen, swipe right to left ----------
function PromoCarousel({ items }) {
  const railRef = React.useRef(null);
  const [page, setPage] = useState(0);

  const onScroll = () => {
    const el = railRef.current;
    if (!el) return;
    const step = el.scrollWidth / items.length;
    setPage(Math.min(items.length - 1, Math.round(el.scrollLeft / step)));
  };

  const goTo = (i) => {
    const el = railRef.current;
    if (!el) return;
    el.scrollTo({ left: (el.scrollWidth / items.length) * i, behavior: "smooth" });
  };

  return (
    <div>
      <div
        ref={railRef}
        onScroll={onScroll}
        className="rail"
        style={{ display: "flex", gap: 10, overflowX: "auto", scrollSnapType: "x mandatory", paddingBottom: 2 }}
      >
        {items.map((b) => (
          <div
            key={b.id}
            style={{
              flex: "0 0 calc(50% - 5px)",
              scrollSnapAlign: "start",
              borderRadius: 16,
              padding: 13,
              minHeight: 122,
              background: `linear-gradient(150deg, ${b.from}, ${b.to})`,
              display: "flex",
              flexDirection: "column",
              justifyContent: "space-between",
              cursor: "pointer",
              position: "relative",
              overflow: "hidden",
            }}
          >
            <div style={{ position: "absolute", right: -18, top: -18, width: 62, height: 62, borderRadius: 999, background: "rgba(255,255,255,0.12)" }} />
            <div style={{ width: 28, height: 28, borderRadius: 9, background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center" }}>

  );

function AddServiceScreen({ activeAddOnIds, currentTariffId, onBack, onOpenService }) {
  const [cat, setCat] = useState("all");
  const [sort, setSort] = useState("recommended");
  const [priceBand, setPriceBand] = useState("any");
  const [duration, setDuration] = useState("any");
  const [filterOpen, setFilterOpen] = useState(false);

  const isActive = (item) => (item.kind === "tariff" ? item.id === currentTariffId : activeAddOnIds.includes(item.id));
  const filtersOn = priceBand !== "any" || duration !== "any" || sort !== "recommended";

  const items = sortServices(
    catalogServices().filter(
      (x) => (cat === "all" || x.category === cat) && inPriceBand(x.price, priceBand) && inDurationBand(x.validity, duration)
    ),
    sort
  );

  const featured = sort === "recommended" ? items.find((x) => x.recommended && !isActive(x)) : null;
  const rest = featured ? items.filter((x) => x.id !== featured.id) : items;

  return (
    <div style={{ padding: "6px 20px 28px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <div onClick={onBack} style={{ width: 34, height: 34, borderRadius: 999, background: C.surface, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>

        <div style={{ flex: 1 }}>

          <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11.5 }}>Vyber si to, čo ti sadne</div>
        </div>
        <div
          onClick={() => setFilterOpen(true)}
          style={{ width: 34, height: 34, borderRadius: 999, background: filtersOn ? C.violet : C.surface, border: `1px solid ${filtersOn ? C.violet : C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}

      {/* categories */}
      <div className="rail" style={{ display: "flex", gap: 7, overflowX: "auto", paddingBottom: 4, marginBottom: 14 }}>
        {serviceCategories.map((c) => {
          const isOn = cat === c.id;
          return (
            <div
              key={c.id}
              onClick={() => setCat(c.id)}
              style={{ flexShrink: 0, padding: "7px 13px", borderRadius: 999, cursor: "pointer", background: isOn ? C.violet : C.surface, border: `1px solid ${isOn ? C.violet : C.line}`, color: isOn ? "#fff" : C.inkDim, fontFamily: FONT_BODY, fontSize: 12.5, fontWeight: 600 }}
            >
              {c.label}
            </div>
          );
        })}
      </div>

      {featured && <FeaturedServiceCard item={featured} active={isActive(featured)} onOpen={() => onOpenService(featured)} />}

      {rest.map((item) => (
        <ServiceCard key={item.id} item={item} active={isActive(item)} onOpen={() => onOpenService(item)} />
      ))}

      {items.length === 0 && (
        <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 12.5, textAlign: "center", padding: "26px 0" }}>
          Pre tento filter nemáme žiadnu službu.
        </div>

      {filterOpen && (
        <FilterSheet
          sort={sort} setSort={setSort}
          priceBand={priceBand} setPriceBand={setPriceBand}
          duration={duration} setDuration={setDuration}
          count={items.length}
          onClose={() => setFilterOpen(false)}
          onReset={() => { setSort("recommended"); setPriceBand("any"); setDuration("any"); }}
        />
      )}
    </div>
  );
}

function TopUpSheet({ credit, onClose, onConfirm }) {
  const [step, setStep] = useState("amount");

  const [method, setMethod] = useState("saved");

  const amount = Math.round((parseFloat(String(raw).replace(",", ".")) || 0) * 100) / 100;
  const valid = amount >= 1 && amount <= 500;

  if (step === "done") {
    return (
      <Sheet title="Kredit dobitý" subtitle={`Nový kredit ${eur(credit)}`} onClose={onClose} footer={<PrimaryButton onClick={onClose}>Hotovo</PrimaryButton>}>

          <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 12, textAlign: "center" }}>

          </div>
        </div>
      </Sheet>
    );
  }

  if (step === "method") {
    return (
      <Sheet
        title="Spôsob platby"
        subtitle={`Dobitie ${eur(amount)}`}
        onClose={onClose}
        footer={<PrimaryButton onClick={() => { onConfirm(amount, method); setStep("done"); }}>Zaplatiť {eur(amount)}</PrimaryButton>}
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
          {topUpMethods.map((m) => {
            const isOn = method === m.id;
            return (
              <div
                key={m.id}
                onClick={() => setMethod(m.id)}
                style={{ display: "flex", alignItems: "center", gap: 11, padding: 13, borderRadius: 14, cursor: "pointer", background: isOn ? C.violetSoft : C.surface, border: `1px solid ${isOn ? C.violet : C.line}` }}

                <div style={{ width: 34, height: 34, borderRadius: 10, background: isOn ? C.violet : C.violetSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <m.icon size={16} color={isOn ? "#fff" : C.violet} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13, fontWeight: 600 }}>{m.name}</div>
                  <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11, lineHeight: 1.35, marginTop: 1 }}>{m.desc}</div>

                <div style={{ width: 18, height: 18, borderRadius: 999, border: `1.5px solid ${isOn ? C.violet : C.line}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>

        >
          ← Zmeniť sumu
        </div>
      </Sheet>
    );
  }

  return (
    <Sheet
      title="Dobiť kredit"
      subtitle={`Aktuálny kredit ${eur(credit)}`}
      onClose={onClose}
      footer={<PrimaryButton disabled={!valid} onClick={() => setStep("method")}>Pokračovať</PrimaryButton>}
    >
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {topUpPresets.map((v) => {

  const [sims, setSims] = useState(1);
  const [method, setMethod] = useState("card");

  const tariff = item.tariff;
  const ladder = tariff ? tariffLadder(tariff) : null;
  const due = tariff ? firstMonthPrice(tariff, sims) : item.price;
  const monthly = tariff ? monthlyPrice(tariff, sims) : item.price;
  const creditOk = credit >= due;
  const canPay = method !== "credit" || creditOk;

  // ---------- payment successful ----------
  if (step === "done") {
    return (
      <div style={{ padding: "6px 20px 28px" }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12, padding: "40px 0 22px" }}>
          <CheckCircle size={56} color={C.green} strokeWidth={1.5} />
          <div style={{ color: C.ink, fontFamily: FONT_HEAD, fontSize: 21, fontWeight: 600, textAlign: "center" }}>Platba prebehla úspešne</div>
          <div style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 13, textAlign: "center", lineHeight: 1.45 }}>
            {item.name} je aktívna{item.kind === "tariff" ? " na tvojom čísle" : ""}.
          </div>
        </div>

        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: "4px 14px", marginBottom: 18 }}>
          <SheetRow title="Zaplatené" right={<span style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13, fontWeight: 700 }}>{eur(due)}</span>} />
          <SheetRow title="Spôsob platby" right={<span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12.5 }}>{method === "card" ? "Karta •••• 4471" : "Kredit"}</span>} />
          {item.kind === "tariff" && (
            <SheetRow title="Ďalšia platba" right={<span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12.5 }}>{eur(monthly)} / mesiac</span>} />
          )}
        </div>

        <PrimaryButton onClick={onDone}>Hotovo</PrimaryButton>
      </div>
    );
  }

  // ---------- select payment method ----------
  if (step === "payment") {
    return (
      <div style={{ padding: "6px 20px 28px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <div onClick={() => setStep("details")} style={{ width: 34, height: 34, borderRadius: 999, background: C.surface, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            <ArrowLeft size={15} color={C.ink} />
          </div>
          <div>
            <div style={{ color: C.ink, fontFamily: FONT_HEAD, fontSize: 18, fontWeight: 600, lineHeight: 1.15 }}>Spôsob platby</div>
            <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11.5 }}>{item.name}</div>
          </div>
        </div>

        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: "4px 14px", marginBottom: 18 }}>
          <SheetRow
            title={item.kind === "tariff" && ladder ? "Prvá platba" : "K úhrade"}
            right={<span style={{ color: C.ink, fontFamily: FONT_HEAD, fontSize: 16, fontWeight: 700 }}>{eur(due)}</span>}
          />
          {item.kind === "tariff" && (
            <SheetRow
              title={sims > 1 ? `Mesačne (${sims} SIM)` : "Mesačne potom"}
              right={<span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12.5 }}>{eur(monthly)}</span>}
            />
          )}
          <SheetRow title="Platnosť" right={<span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12.5 }}>{item.validity}</span>} />
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
          {paymentMethods.map((m) => {
            const disabled = m.id === "credit" && !creditOk;
            const isOn = method === m.id;
            return (
              <div
                key={m.id}
                onClick={() => { if (!disabled) setMethod(m.id); }}
                style={{
                  display: "flex", alignItems: "center", gap: 11, padding: 13, borderRadius: 14,
                  cursor: disabled ? "default" : "pointer",
                  background: isOn ? C.violetSoft : C.surface,
                  border: `1px solid ${isOn ? C.violet : C.line}`,
                  opacity: disabled ? 0.55 : 1,
                }}
              >
                <div style={{ width: 34, height: 34, borderRadius: 10, background: isOn ? C.violet : C.violetSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <m.icon size={16} color={isOn ? "#fff" : C.violet} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13, fontWeight: 600 }}>{m.name}</div>
                  <div style={{ color: disabled ? C.coral : C.inkFaint, fontFamily: FONT_BODY, fontSize: 11, lineHeight: 1.35, marginTop: 1 }}>
                    {m.id === "credit"
                      ? (creditOk ? `Dostupný kredit ${eur(credit)}` : `Nedostatočný kredit — máš ${eur(credit)}`)
                      : m.desc}
                  </div>
                </div>
                <div style={{ width: 18, height: 18, borderRadius: 999, border: `1.5px solid ${isOn ? C.violet : C.line}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  {isOn && <div style={{ width: 9, height: 9, borderRadius: 999, background: C.violet }} />}
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ marginTop: 22 }}>
          <PrimaryButton disabled={!canPay} onClick={() => { onActivate(item, sims, method); setStep("done"); }}>
            Potvrdiť a zaplatiť {eur(due)}
          </PrimaryButton>
          <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11, textAlign: "center", marginTop: 9, lineHeight: 1.4 }}>
            Bez viazanosti, zrušíš kedykoľvek.
          </div>
        </div>
      </div>
    );
  }

  // ---------- plan details ----------
  return (
    <div style={{ padding: "6px 20px 28px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <div onClick={onBack} style={{ width: 34, height: 34, borderRadius: 999, background: C.surface, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
          <ArrowLeft size={15} color={C.ink} />
        </div>
        <div style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12.5, fontWeight: 600 }}>
          {item.kind === "tariff" ? "Detail paušálu" : "Detail služby"}
        </div>
      </div>

      <div style={{ background: `linear-gradient(150deg, ${C.violet}, ${C.violetDeep})`, borderRadius: 20, padding: 18 }}>
        {item.badge && (
          <span style={{ display: "inline-block", background: "rgba(255,255,255,0.22)", color: "#fff", fontFamily: FONT_BODY, fontSize: 10, fontWeight: 700, letterSpacing: ".1em", padding: "4px 9px", borderRadius: 7, marginBottom: 9 }}>
            {item.badge}
          </span>
        )}
        <div style={{ color: "#fff", fontFamily: FONT_HEAD, fontSize: 27, fontWeight: 700, lineHeight: 1.05 }}>{item.name}</div>
        <div style={{ color: "rgba(255,255,255,0.82)", fontFamily: FONT_BODY, fontSize: 12, lineHeight: 1.4, marginTop: 6 }}>{item.desc}</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 5, marginTop: 14 }}>
          <span style={{ color: "#fff", fontFamily: FONT_HEAD, fontSize: 34, fontWeight: 700, lineHeight: 1 }}>{eur(monthly)}</span>
          <span style={{ color: "rgba(255,255,255,0.78)", fontFamily: FONT_BODY, fontSize: 13 }}>
            {item.validity === "Mesačne" ? "/ mesiac" : `/ ${item.validity}`}
          </span>
        </div>
        {ladder && (
          <div style={{ color: "rgba(255,255,255,0.72)", fontFamily: FONT_BODY, fontSize: 11.5, marginTop: 4 }}>
            Prvý mesiac {eur(due)}, potom cena klesá
          </div>
        )}
        {tariff && tariff.digitalOnly && (
          <div style={{ marginTop: 12 }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "rgba(255,255,255,0.18)", color: "#fff", fontFamily: FONT_BODY, fontSize: 11, fontWeight: 600, padding: "5px 10px", borderRadius: 8 }}>
              <CreditCard size={11} color="#fff" /> Iba digitálne
            </span>
          </div>
        )}
      </div>

      <SetupSection title="Čo získaš">
        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: "6px 14px" }}>
          {(tariff ? tariffFeatures(tariff) : addOnFeatures(item)).map((f, i, arr) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 11, padding: "11px 0", borderBottom: i === arr.length - 1 ? "none" : `1px solid ${C.line}` }}>
              <div style={{ width: 30, height: 30, borderRadius: 9, background: C.violetSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <f.icon size={15} color={C.violet} />
              </div>
              <span style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13 }}>{f.text}</span>
              <Check size={14} color={C.green} style={{ marginLeft: "auto" }} />
            </div>
          ))}
        </div>
      </SetupSection>

      {ladder && (
        <SetupSection title="Čím dlhšie zostávaš, tým menej platíš" note="Cena za hlavnú SIM kartu v čase">
          <div className="rail" style={{ display: "flex", gap: 7, overflowX: "auto", paddingBottom: 2 }}>
            {ladder.map((stepItem, i) => {
              const isLast = i === ladder.length - 1;
              return (
                <div
                  key={i}
                  style={{ flex: "0 0 78px", borderRadius: 14, padding: "11px 9px", textAlign: "center", background: isLast ? C.violet : C.surface, border: `1px solid ${isLast ? C.violet : C.line}` }}
                >
                  <div style={{ color: isLast ? "rgba(255,255,255,0.75)" : C.inkFaint, fontFamily: FONT_BODY, fontSize: 9.5, fontWeight: 600, letterSpacing: ".03em" }}>{stepItem.month}</div>
                  <div style={{ color: isLast ? "#fff" : C.ink, fontFamily: FONT_HEAD, fontSize: 19, fontWeight: 700, margin: "4px 0 2px", fontVariantNumeric: "tabular-nums" }}>{stepItem.price} €</div>
                  <div style={{ color: isLast ? "rgba(255,255,255,0.8)" : C.inkFaint, fontFamily: FONT_BODY, fontSize: 9, lineHeight: 1.2 }}>{stepItem.note}</div>
                </div>
              );
            })}
          </div>
        </SetupSection>
      )}

      {tariff && tariff.family && (
        <SetupSection title="Flexi Family" note={`Prvá SIM ${tariff.price} €, každá ďalšia +${tariff.family.extraPrice} €`}>
          <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ flex: 1 }}>
                <div style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13, fontWeight: 600 }}>Počet SIM kariet</div>
                <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11, marginTop: 2 }}>Rovnaké služby pre celú rodinu</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div
                  onClick={() => setSims((v) => Math.max(1, v - 1))}
                  style={{ width: 30, height: 30, borderRadius: 999, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: sims > 1 ? "pointer" : "default", opacity: sims > 1 ? 1 : 0.4 }}
                >
                  <span style={{ color: C.violet, fontFamily: FONT_HEAD, fontSize: 17, fontWeight: 700, lineHeight: 1 }}>−</span>
                </div>
                <span style={{ color: C.ink, fontFamily: FONT_HEAD, fontSize: 17, fontWeight: 700, minWidth: 14, textAlign: "center" }}>{sims}</span>
                <div
                  onClick={() => setSims((v) => Math.min(tariff.family.max, v + 1))}
                  style={{ width: 30, height: 30, borderRadius: 999, background: sims < tariff.family.max ? C.violet : C.line, display: "flex", alignItems: "center", justifyContent: "center", cursor: sims < tariff.family.max ? "pointer" : "default" }}
                >
                  <Plus size={15} color={sims < tariff.family.max ? "#fff" : C.inkFaint} strokeWidth={2.4} />
                </div>
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
              <span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12 }}>Spolu za {sims} {sims === 1 ? "SIM" : "SIM karty"}</span>
              <span style={{ color: C.violetDeep, fontFamily: FONT_HEAD, fontSize: 16, fontWeight: 700 }}>{monthly} € / mesiac</span>
            </div>
          </div>
        </SetupSection>
      )}

      {tariff && tariff.benefits && (
        <SetupSection title="Exkluzívne benefity po 3 mesiacoch">
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {tariff.benefits.map((b, i) => (
              <div key={i} style={{ background: C.surfaceSoft, borderRadius: 16, padding: 14 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
                  <div style={{ width: 30, height: 30, borderRadius: 9, background: C.violet, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <b.icon size={15} color="#fff" />
                  </div>
                  <span style={{ color: C.ink, fontFamily: FONT_HEAD, fontSize: 14, fontWeight: 600 }}>{b.title}</span>
                </div>
                <div style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 11.5, lineHeight: 1.45 }}>{b.desc}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 5, marginTop: 8 }}>
                  {b.items.map((it, j) => (
                    <div key={j} style={{ display: "flex", alignItems: "center", gap: 7 }}>
                      <Check size={13} color={C.green} />
                      <span style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 12 }}>{it}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </SetupSection>
      )}

      <SetupSection title="Podmienky">
        <div style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12, lineHeight: 1.5 }}>
          Služba platí {item.region === "SK" ? "na Slovensku" : `v regióne ${item.region}`}, {item.validity === "Mesačne" ? "účtuje sa mesačne" : `platnosť ${item.validity}`}.
          Bez viazanosti, zrušíš ju kedykoľvek v aplikácii.
        </div>
      </SetupSection>

      <div style={{ marginTop: 22 }}>
        <PrimaryButton onClick={() => setStep("payment")}>Pokračovať · {eur(due)}</PrimaryButton>
      </div>
    </div>
  );
}

// ---------- home screen ----------
function HomeScreen({
  numbers,
  activeNumberId,
  onSelectNumber,
  assignments,
  fixedActive,
  onRemoveAddOn,
  onRemoveFixed,
  onOpenSheet,
  onOpenHugo,
  onOpenNotifications,
  onOpenMenu,
}) {
  const [expandedFixed, setExpandedFixed] = useState(null);

  const assignment = assignments[activeNumberId] || { tariffId: null, addOns: [] };
  const tariff = tariffCatalog.find((t) => t.id === assignment.tariffId) || null;
  const activeAddOns = addOnCatalog.filter((a) => assignment.addOns.includes(a.id));
  const activeFixed = fixedCatalog.filter((f) => fixedActive.includes(f.id));

  return (
    <div style={{ padding: "0 20px 24px" }}>
      {/* top bar: Hugo left, notifications + menu right */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 0 14px" }}>
        <div onClick={onOpenHugo} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: C.violetSoft, padding: "7px 12px", borderRadius: 999 }}>
          <MessageCircle size={14} color={C.violet} />
          <span style={{ color: C.violet, fontFamily: FONT_BODY, fontSize: 12, fontWeight: 600 }}>Hugo</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div onClick={onOpenNotifications} style={{ width: 34, height: 34, borderRadius: 999, background: C.surface, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", position: "relative" }}>
            <Bell size={15} color={C.ink} />
            <div style={{ position: "absolute", top: 8, right: 9, width: 6, height: 6, borderRadius: 999, background: C.coral }} />
          </div>
          <div onClick={onOpenMenu} style={{ width: 34, height: 34, borderRadius: 999, background: C.surface, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            <Menu size={15} color={C.ink} />
          </div>
        </div>
      </div>

      <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 13 }}>Dobré ráno</div>
      <div style={{ color: C.ink, fontFamily: FONT_HEAD, fontSize: 23, fontWeight: 600, marginBottom: 16 }}>Tvoje 4ka</div>

      <NumberSelector
        numbers={numbers}
        activeId={activeNumberId}
        onSelect={(id) => { onSelectNumber(id); setExpandedFixed(null); }}
        onAdd={() => onOpenSheet("number")}
      />

      {/* mobilné služby: current program (2/3) vs. add a new service (1/3) */}
      <SectionHeader title="Mobilné služby" />

      {tariff ? (
        <div style={{ display: "grid", gridTemplateColumns: "1.85fr 1fr", gap: 9, marginBottom: 10 }}>
          <ProgramCard tariff={tariff} sims={assignment.sims || 1} onOpen={() => onOpenSheet("program")} />
          <AddServiceCard onOpen={() => onOpenSheet("add")} />
        </div>
      ) : (
        <AddServiceCard wide onOpen={() => onOpenSheet("add")} />
      )}

      {activeAddOns.map((a) => (
        <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 13px", marginBottom: 8 }}>
          <span style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 13 }}>{a.name}</span>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12 }}>+{a.price} €</span>
            <Trash2 size={13} color={C.inkFaint} onClick={() => onRemoveAddOn(activeNumberId, a.id)} style={{ cursor: "pointer" }} />
          </div>
        </div>
      ))}

      {/* fixné služby */}
      <div style={{ marginTop: 22 }}>
        <SectionHeader
          title="Fixné služby"
          action={
            activeFixed.length > 0 && (
              <div onClick={() => onOpenSheet("fixed")} style={{ display: "flex", alignItems: "center", gap: 4, cursor: "pointer", color: C.violet, fontFamily: FONT_BODY, fontSize: 12, fontWeight: 600 }}>
                <Plus size={13} /> Pridať
              </div>
            )
          }
        />

        {activeFixed.length === 0 && (
          <AddServiceCard wide onOpen={() => onOpenSheet("fixed")} />
        )}

        {activeFixed.map((f) => (
          <FixedCard
            key={f.id}
            item={f}
            open={expandedFixed === f.id}
            onToggle={() => setExpandedFixed(expandedFixed === f.id ? null : f.id)}
            onRemove={() => onRemoveFixed(f.id)}
          />
        ))}
      </div>

      {/* promo — visually secondary, swipeable */}
      <div style={{ marginTop: 24 }}>
        <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11, fontWeight: 600, letterSpacing: ".06em", textTransform: "uppercase", marginBottom: 10 }}>
          Pre teba
        </div>
        <PromoCarousel items={promoBanners} />
      </div>
    </div>
  );
}

  return (

      <div style={{ color: C.ink, fontFamily: FONT_HEAD, fontSize: 23, fontWeight: 600 }}>4ka E-shop</div>
      <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 12.5, marginBottom: 16 }}>Kúp si SIM alebo eSIM</div>

        const isOpen = openId === p.id;
        return (
          <div key={p.id} style={{ background: C.surface, border: `1px solid ${isOpen ? C.violet : C.line}`, borderRadius: 16, padding: 14, marginBottom: 10 }}>
            <div onClick={() => setOpenId(isOpen ? null : p.id)} style={{ display: "flex", alignItems: "center", gap: 11, cursor: "pointer" }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: C.violetSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <p.icon size={17} color={C.violet} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 14, fontWeight: 600 }}>{p.name}</div>
                <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11.5 }}>{p.desc}</div>
              </div>
              <ChevronDown size={14} color={C.inkFaint} style={{ transform: isOpen ? "rotate(180deg)" : "none" }} />
            </div>

            {isOpen && (
              <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
                <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 10.5, fontWeight: 600, letterSpacing: ".07em", textTransform: "uppercase", marginBottom: 9 }}>
                  Priebeh objednávky
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {p.steps.map((s, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 9 }}>
                      <div style={{ width: 20, height: 20, borderRadius: 999, background: C.violetSoft, color: C.violet, fontFamily: FONT_BODY, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        {i + 1}
                      </div>
                      <span style={{ color: C.ink, fontFamily: FONT_BODY, fontSize: 12.5 }}>{s}</span>
                    </div>
                  ))}
                </div>
                <div style={{ marginTop: 13 }}>
                  <PrimaryButton onClick={() => {}}>Objednať {p.name}</PrimaryButton>
                </div>
              </div>
            )}
          </div>
        );
      })}

      <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 14, color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 11.5 }}>
        <MoreHorizontal size={14} color={C.inkFaint} />
        Checkout, ceny a finálny dizajn — TBD
      </div>
    </div>
  );
}

// ---------- one independent phone instance ----------
function PhoneApp({ label }) {
  const [tab, setTab] = useState("home");
  const [activeNumberId, setActiveNumberId] = useState("n1");
  const [assignments, setAssignments] = useState(seedAssignments);
  const [fixedActive, setFixedActive] = useState(seedFixed);
  const [credit, setCredit] = useState(seedCredit);
  const [history, setHistory] = useState(seedHistory);
  const [catalogOpen, setCatalogOpen] = useState(false);   // Add Service catalog page
  const [detailItem, setDetailItem] = useState(null);      // service opened from the catalog
  const [overlay, setOverlay] = useState(null); // 'hugo' | 'notif' | 'menu' | 'number' | 'program' | 'add' | 'fixed' | 'topup' | null

  const assignment = assignments[activeNumberId] || { tariffId: null, addOns: [] };
  const tariff = tariffCatalog.find((t) => t.id === assignment.tariffId) || null;
  const availableFixed = fixedCatalog.filter((f) => !fixedActive.includes(f.id));

  // every purchase shows up in Wallet history
  const logPurchase = (title, amount, sign) =>
    setHistory((prev) => [{ id: Date.now() + Math.random(), title, date: "Dnes", amount, sign }, ...prev]);

  const setTariff = (numberId, tariffId) => {
    const t = tariffCatalog.find((x) => x.id === tariffId);
    if (t && assignments[numberId].tariffId !== tariffId) logPurchase(`${t.name} — mesačná platba`, t.price, -1);
    setAssignments((prev) => ({ ...prev, [numberId]: { ...prev[numberId], tariffId } }));
  };
  const addAddOn = (numberId, addOnId) => {
    const a = addOnCatalog.find((x) => x.id === addOnId);
    if (a) logPurchase(a.name, a.price, -1);
    setAssignments((prev) => ({ ...prev, [numberId]: { ...prev[numberId], addOns: [...prev[numberId].addOns, addOnId] } }));
  };
  const removeAddOn = (numberId, addOnId) => setAssignments((prev) => ({ ...prev, [numberId]: { ...prev[numberId], addOns: prev[numberId].addOns.filter((a) => a !== addOnId) } }));
  const addFixed = (fixedId) => {
    const f = fixedCatalog.find((x) => x.id === fixedId);
    if (f) logPurchase(f.name, f.price, -1);
    setFixedActive((prev) => [...prev, fixedId]);
  };
  const openTariffSetup = (tariffId) => {
    const t = tariffCatalog.find((x) => x.id === tariffId);
    setOverlay(null);
    if (t) setDetailItem(tariffAsService(t));
  };

  // one activation path for tariffs and add-ons alike
  const activateService = (item, sims, method) => {
    const due = item.kind === "tariff" ? firstMonthPrice(item.tariff, sims) : item.price;
    if (item.kind === "tariff") {
      setAssignments((prev) => ({ ...prev, [activeNumberId]: { ...prev[activeNumberId], tariffId: item.tariff.id, sims } }));
      logPurchase(`${item.name} — prvá platba${sims > 1 ? ` · ${sims} SIM` : ""}`, due, -1);
    } else {
      setAssignments((prev) => ({
        ...prev,
        [activeNumberId]: {
          ...prev[activeNumberId],
          addOns: prev[activeNumberId].addOns.includes(item.id) ? prev[activeNumberId].addOns : [...prev[activeNumberId].addOns, item.id],
        },
      }));
      logPurchase(item.name, due, -1);
    }
    if (method === "credit") setCredit((prev) => Math.round((prev - due) * 100) / 100);
  };
  const topUp = (amount, method) => {
    setCredit((prev) => Math.round((prev + amount) * 100) / 100);
    logPurchase(method === "saved" ? "Dobitie kreditu · uložená karta" : "Dobitie kreditu · online platba", amount, 1);
  };
  const removeFixed = (fixedId) => setFixedActive((prev) => prev.filter((f) => f !== fixedId));

  const reset = () => {
    setTab("home");
    setActiveNumberId("n1");
    setAssignments(seedAssignments);
    setFixedActive(seedFixed);
    setCredit(seedCredit);
    setHistory(seedHistory);
    setCatalogOpen(false);
    setDetailItem(null);
    setOverlay(null);
  };

  const tabs = useMemo(() => ([
    { id: "home", label: "Domov", icon: Home },
    { id: "wallet", label: "Peňaženka", icon: WalletIcon },
    { id: "eshop", label: "E-shop", icon: ShoppingBag },
  ]), []);

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }}>
      <div className="phone-label">
        <i></i>{label}
        <button className="chip" onClick={reset}>Reset</button>
      </div>

      <div style={{ width: 375, height: 780, borderRadius: 44, background: "#000", padding: 10, boxShadow: "0 30px 60px rgba(30,21,48,0.35)" }}>
        <div className="device" style={{ width: "100%", height: "100%", borderRadius: 34, background: C.bg, overflow: "hidden", display: "flex", flexDirection: "column", position: "relative" }}>
          <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 120, height: 22, background: "#000", borderBottomLeftRadius: 14, borderBottomRightRadius: 14, zIndex: 30 }} />
          <StatusBar />

          {overlay === "hugo" && <HugoChat onClose={() => setOverlay(null)} />}
          {overlay === "notif" && <NotificationsPanel onClose={() => setOverlay(null)} />}
          {overlay === "menu" && <MenuSheet onClose={() => setOverlay(null)} />}
          {overlay === "number" && (
            <NumberSheet onClose={() => setOverlay(null)} onGoEshop={() => { setOverlay(null); setTab("eshop"); }} />
          )}
          {overlay === "topup" && (
            <TopUpSheet credit={credit} onClose={() => setOverlay(null)} onConfirm={topUp} />
          )}

          {overlay === "program" && tariff && (
            <ProgramSheet
              tariff={tariff}
              sims={assignment.sims || 1}
              onClose={() => setOverlay(null)}
              onChangeTariff={openTariffSetup}
            />
          )}

          {overlay === "fixed" && (
            <Sheet title="Pridať fixnú službu" subtitle="Internet a TV k tomuto účtu" onClose={() => setOverlay(null)}>
              {availableFixed.length ? (
                availableFixed.map((f) => (
                  <SheetRow
                    key={f.id}
                    icon={f.icon}
                    title={f.name}
                    meta={f.desc}
                    onClick={() => { addFixed(f.id); setOverlay(null); }}
                    right={<span style={{ color: C.inkDim, fontFamily: FONT_BODY, fontSize: 12.5 }}>{f.price} €</span>}
                  />
                ))
              ) : (
                <div style={{ color: C.inkFaint, fontFamily: FONT_BODY, fontSize: 12, padding: "10px 4px" }}>Všetky fixné služby sú už aktívne.</div>
              )}
            </Sheet>
          )}

          <div style={{ flex: 1, overflowY: "auto" }}>
            {detailItem && (
              <ServiceDetailScreen
                item={detailItem}
                credit={credit}
                onBack={() => setDetailItem(null)}
                onActivate={activateService}
                onDone={() => { setDetailItem(null); setCatalogOpen(false); setTab("home"); }}
              />
            )}
            {!detailItem && catalogOpen && (
              <AddServiceScreen
                activeAddOnIds={assignment.addOns}
                currentTariffId={assignment.tariffId}
                onBack={() => setCatalogOpen(false)}
                onOpenService={setDetailItem}
              />
            )}
            {!detailItem && !catalogOpen && tab === "home" && (
              <HomeScreen
                numbers={seedNumbers}
                activeNumberId={activeNumberId}
                onSelectNumber={setActiveNumberId}
                assignments={assignments}
                fixedActive={fixedActive}
                onRemoveAddOn={removeAddOn}
                onRemoveFixed={removeFixed}
                onOpenSheet={(kind) => (kind === "add" ? setCatalogOpen(true) : setOverlay(kind))}
                onOpenHugo={() => setOverlay("hugo")}
                onOpenNotifications={() => setOverlay("notif")}
                onOpenMenu={() => setOverlay("menu")}
              />
            )}
            {!detailItem && !catalogOpen && tab === "wallet" && <WalletScreen credit={credit} history={history} onTopUp={() => setOverlay("topup")} />}
            {!detailItem && !catalogOpen && tab === "eshop" && <EshopScreen />}
          </div>

          <div style={{ display: detailItem || catalogOpen ? "none" : "flex", justifyContent: "space-around", alignItems: "flex-start", padding: "10px 10px 22px", background: C.surface, borderTop: `1px solid ${C.line}` }}>
            {tabs.map(({ id, label: tlabel, icon: Icon }) => {
              const isActive = tab === id;
              return (
                <div key={id} onClick={() => { setTab(id); setOverlay(null); }} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", color: isActive ? C.violet : C.inkFaint }}>
                  <Icon size={20} strokeWidth={isActive ? 2.4 : 1.8} />
                  <span style={{ fontSize: 10, fontFamily: FONT_BODY, fontWeight: 600 }}>{tlabel}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- root: two independent screens side by side ----------
function Moja4kaPrototype() {
  return (
    <div className="deck">
      <PhoneApp label="Variant A" />
      <PhoneApp label="Variant B" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Moja4kaPrototype />);
</script>
